name: CI Pipeline

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: make lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: make format-check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, format]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: make test-unit

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, format]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de integración
        run: make test-integration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRACION: ${{secrets.JWT_EXPIRACION}}
          JWT_REFRESH_EXPIRACION: ${{secrets.JWT_REFRESH_EXPIRACION}}
          NEXT_PUBLIC_URL: ${{secrets.NEXT_PUBLIC_URL}}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  test-e2e:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [lint, format]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Build de la aplicación
        run: make build
        env:
          NODE_ENV: test

      - name: Ejecutar pruebas E2E API
        run: make test-e2e
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRACION: ${{secrets.JWT_EXPIRACION}}
          JWT_REFRESH_EXPIRACION: ${{secrets.JWT_REFRESH_EXPIRACION}}
          NEXT_PUBLIC_URL: ${{secrets.NEXT_PUBLIC_URL}}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Subir reporte E2E
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: test-results/

  ci-success:
    name: CI completo
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-e2e]
    steps:
      - name: Pipeline exitoso
        run: echo "Lint, Format y todos los Tests pasaron correctamente."
